name: Cloud market radar scan

on:
  workflow_dispatch:
  schedule:
    # Beijing 07:30, premarket event calendar.
    - cron: "30 23 * * 0-4"
    # Beijing 15:45, premarket level 1.
    - cron: "45 7 * * 1-5"
    # Beijing 17:30, premarket level 2.
    - cron: "30 9 * * 1-5"
    # Beijing 20:50, final pre-open check.
    - cron: "50 12 * * 1-5"
    # Beijing 21:45/22:45/23:45, intraday VWAP checks.
    - cron: "45 13,14,15 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.2.2" "yfinance>=0.2.66" "requests>=2.31" numpy

      - name: Run cloud radar scan
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          QUOTE_CHECK_LIMIT: "30"
          TWELVEDATA_BATCH_SIZE: "8"
          TWELVEDATA_BATCH_WAIT_SECONDS: "90"
        run: python scripts/cloud_scheduled_scan.py

      - name: Commit latest scan result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results/latest.json
          git diff --cached --quiet || git commit -m "Update scheduled market scan"
          git push
